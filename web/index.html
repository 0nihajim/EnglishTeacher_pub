<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f1e9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#252822" media="(prefers-color-scheme: dark)" />
    <title>English Teacher</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%23355942'/><g fill='%23e3e9dc'><rect x='15' y='25' width='7' height='15' rx='3.5'/><rect x='28' y='13' width='7' height='38' rx='3.5'/><rect x='41' y='20' width='7' height='25' rx='3.5'/></g></svg>"
    />
  </head>
  <body>
    <header class="masthead">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
        <h1>English Teacher</h1>
      </div>
      <span class="edition" lang="en">A little practice, every day.</span>
      <button id="history-open" type="button" hidden>履歴</button>
    </header>
    <dialog id="history-dialog" aria-labelledby="history-title">
      <div class="history-header">
        <h2 id="history-title">練習の記録</h2>
        <button class="history-close" type="button" aria-label="履歴を閉じる">閉じる</button>
      </div>
      <p class="history-status" role="status"></p>
      <div class="history-import">
        <button class="history-import-open" type="button">以前の復習を取り込む</button>
        <input class="history-import-file" type="file" accept=".json,application/json" hidden />
      </div>
      <div class="history-layout">
        <aside aria-label="レッスン一覧">
          <div class="history-list"></div>
          <button class="history-more" type="button" hidden>もっと見る</button>
        </aside>
        <div class="history-detail"></div>
      </div>
    </dialog>
    <main id="layout">
      <div id="stage" data-state="idle" data-turn="you">
        <!-- 番の表示。先生(塗り)・あなた(破線と自分の声の棒)・聞いている(薄い点)。 -->
        <div id="voice">
          <div class="halo" aria-hidden="true">
            <span class="ring"></span>
            <span class="core"></span>
            <canvas class="wave" width="80" height="44"></canvas>
          </div>
          <p class="turn-label"></p>
          <p class="turn-sub"></p>
        </div>
        <div id="targets" aria-live="polite"></div>
        <div id="board" aria-live="polite"></div>
        <!-- ボード(whiteboard)。学習者が描くキャンバス。先生には変わったときだけ1枚送る。 -->
        <div id="whiteboard" hidden>
          <canvas class="wb-canvas" aria-label="ボード。ペンや指で描けます"></canvas>
          <div class="wb-tools" role="toolbar" aria-label="ボードの道具">
            <button type="button" class="wb-undo" disabled title="一画戻す">戻す</button>
            <button type="button" class="wb-clear" disabled title="全部消す">全消去</button>
            <button type="button" class="wb-pen-only" aria-pressed="false" title="指で描けなくする(手のひら対策)">ペンのみ</button>
            <span class="wb-sent" aria-live="polite"></span>
          </div>
        </div>
        <div id="overlay" aria-live="polite"></div>
        <!-- 先生の最後の一文。ターンが閉じてから出す(話している最中は読ませない)。 -->
        <p id="caption" hidden></p>
        <div id="hero">
          <div class="intro">
            <span class="eyebrow" lang="en">Your daily practice</span>
            <p class="editorial" lang="en">Find your<br /> <em>own voice.</em></p>
            <p class="intro-note">自分の言葉で、少しずつ。</p>
            <section id="daily-review" aria-labelledby="daily-review-title">
              <h2 id="daily-review-title">今日の復習</h2>
              <p class="daily-status" role="status">復習を読み込み中…</p>
              <ol class="daily-items"></ol>
              <button type="button" disabled>復習をはじめる ↗</button>
            </section>
          </div>
          <div class="setup">
            <h2>今日は、何を話そう。</h2>
            <div id="modes" role="group" aria-label="練習モード">
              <button type="button" class="mode" data-mode="scene" aria-pressed="true"><span class="mode-number" aria-hidden="true">01</span><span>シーン会話</span><span class="mode-arrow" aria-hidden="true">↗</span></button>
              <button type="button" class="mode" data-mode="drill" aria-pressed="false"><span class="mode-number" aria-hidden="true">02</span><span>瞬間英作文</span><span class="mode-arrow" aria-hidden="true">↗</span></button>
              <button type="button" class="mode" data-mode="retell" aria-pressed="false"><span class="mode-number" aria-hidden="true">03</span><span>話し直し</span><span class="mode-arrow" aria-hidden="true">↗</span></button>
              <button type="button" class="mode" data-mode="whiteboard" aria-pressed="false"><span class="mode-number" aria-hidden="true">04</span><span>ボード</span><span class="mode-arrow" aria-hidden="true">↗</span></button>
            </div>
            <label id="scene-pick">
              <span>シーン</span>
              <select id="scene" aria-label="シーン"></select>
            </label>
            <label id="image-pick" hidden>
              <input id="image-file" type="file" accept="image/*" aria-label="話す画像を選ぶ" />
              <img id="image-preview" alt="選んだ画像" hidden />
              <span id="image-text">画像を選ぶ・ドロップ</span>
            </label>
            <div id="turn-taking" role="group" aria-label="応答のタイミング">
              <span class="pick-label">応答</span>
              <div class="pills">
                <button type="button" class="opt" data-turn-taking="auto" aria-pressed="true">自動</button>
                <button type="button" class="opt" data-turn-taking="manual" aria-pressed="false">送信ボタン</button>
              </div>
            </div>
            <button id="start" type="button"><span>はじめる</span><span aria-hidden="true">↗</span></button>
            <span class="hint">マイクを使います</span>
          </div>
        </div>
        <div id="loader" hidden aria-hidden="true">
          <span class="orb"></span>
          <span id="loader-label">セッションを開始中…</span>
        </div>
      </div>
      <div id="controls">
        <div id="status" data-kind="idle" role="status">待機中</div>
        <div id="mic-wrap">
          <button id="hint" hidden disabled title="次の一言のヒント">ヒント</button>
          <button id="skip" hidden disabled title="いまの問題を飛ばす">スキップ</button>
          <button id="mic" disabled aria-pressed="false" title="マイクをミュート" aria-label="マイクをミュート">
            <svg class="icon-on" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <rect x="9" y="2" width="6" height="12" rx="3" />
              <path d="M5 10v1a7 7 0 0 0 14 0v-1M12 18v4" />
            </svg>
            <svg class="icon-off" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <rect x="9" y="2" width="6" height="12" rx="3" />
              <path d="M5 10v1a7 7 0 0 0 14 0v-1M12 18v4" />
              <line x1="4" y1="3" x2="20" y2="21" />
            </svg>
            <svg class="icon-send" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M22 2 11 13" />
              <path d="M22 2 15 22l-4-9-9-4 20-7z" />
            </svg>
            <span class="label"></span>
          </button>
          <button id="transcript-toggle" type="button" aria-pressed="false" aria-controls="transcript-panel">字幕</button>
        </div>
        <div id="actions">
          <button id="rail-open" type="button" hidden>言い直し <span class="n">0</span></button>
          <button id="stop" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path
                d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"
                transform="rotate(135 12 12)"
              />
            </svg>
            終了
          </button>
        </div>
      </div>
      <!-- 言い直しレール(案D)。舞台のカードを離れた言い直しが積まれる。字幕と同じ場所を使う。 -->
      <aside id="rail" aria-label="言い直し" hidden>
        <div class="rail-head">
          <h2>言い直し</h2>
          <span class="rail-tally"></span>
          <button type="button" class="rail-close" aria-label="レールを閉じる">×</button>
        </div>
        <div class="rail-list"></div>
      </aside>
      <aside id="transcript-panel" aria-label="字幕" hidden>
        <div class="panel-inner">
          <h2>会話</h2>
          <div id="transcript"></div>
        </div>
      </aside>
    </main>
    <details id="feedback-panel" hidden>
      <summary>指導ノート <span class="feedback-count" aria-live="polite">0</span></summary>
      <div class="feedback-list"></div>
    </details>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
